[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextflight"
version = "0.3.5"
description = "Extract JSON data from Next.js App Router pages: parses React Server Components (RSC) Flight payloads (self.__next_f.push) from server-rendered HTML or raw RSC fetches into clean Python dicts/lists -- for web scraping, crawling, and data extraction with Scrapy, requests, or httpx."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Aly Reda" }
]
keywords = [
    "nextjs", "next.js", "react-server-components", "rsc", "flight",
    "web-scraping", "webscraping", "scraper", "crawler", "scrapy", "zyte",
    "html-parser", "json-extraction", "data-extraction", "app-router",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Stdlib only -- no required runtime dependencies, so it's safe to drop
# into any Scrapy / Zyte project without touching the rest of your
# dependency tree. orjson/pandas/httpx are used automatically if already
# installed (faster JSON decoding, to_dataframe()/to_csv(), from_url_async()
# respectively), but nothing here is required to import or use the package.
dependencies = []

[project.optional-dependencies]
fast = ["orjson"]
pandas = ["pandas"]
async = ["httpx"]
all = ["orjson", "pandas", "httpx"]

[project.urls]
Homepage = "https://github.com/Aly-Reda/nextflight"
Issues = "https://github.com/Aly-Reda/nextflight/issues"

[project.scripts]
nextflight = "nextflight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nextflight = ["py.typed"]
